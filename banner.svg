<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title description">
<title id="title">Diamond Ratings</title>
<desc id="description">Baseball analytics, built from the pitch up. Cream lettering on a midnight green baseball field with a large illustrated baseball, red stitching, and mint diamond details.</desc>
